<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="sidebar.css">
</head>

<body>

<div id="expanded">

<div class="top-bar">
<button id="toggleSidebar">x</button>
<h2 class="app-title">

<svg class="logo-icon" viewBox="0 0 24 24">

<path d="M12 2a10 10 0 00-8.9 14.5L2 22l5.7-1.1A10 10 0 1012 2z"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"/>

<path d="M8 11c1.5 3 4.5 4.5 7 5"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"/>

</svg>

WhatsApp Vendas

</h2>
</div>

<nav class="tab-bar" role="tablist">
<button class="tab-btn active" data-tab="messages" type="button">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
    <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 20l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span>Mensagens</span>
</button>
<button class="tab-btn" data-tab="images" type="button">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
    <path d="M21 15l-5-5-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span>Imagens</span>
</button>
<button class="tab-btn" data-tab="files" type="button">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v6M9.5 13.5L12 16l2.5-2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Arquivos</span>
</button>
</nav>

<div class="tab-panel active" id="panel-messages">

<button id="btn-audio" class="audio-btn">

  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
    <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"/>

    <path d="M19 10v2a7 7 0 01-14 0v-2"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"/>

    <line x1="12" y1="19" x2="12" y2="23"
      stroke="currentColor"
      stroke-width="2"/>

    <line x1="8" y1="23" x2="16" y2="23"
      stroke="currentColor"
      stroke-width="2"/>
  </svg>

  <span>Enviar áudio</span>

</button>

<div id="categories-messages"></div>

</div>

<div class="tab-panel" id="panel-images">

<div id="categories-images"></div>

</div>

<div class="tab-panel" id="panel-files">
<div id="categories-files"></div>
</div>

</div>

<script src="sidebar.js"></script>

<div id="imagePreview" class="image-preview">
<img id="previewImg">
</div>

</body>

</html>
